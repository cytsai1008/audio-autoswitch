[project]
name = "audio-autoswitch"
version = "0.1.0"
description = "One-click Windows microphone switching from the system tray"
readme = "README.md"
authors = [
    { name = "CYTsai", email = "git@mail.photocat.blue" }
]
requires-python = ">=3.12"
dependencies = [
    "comtypes>=1.4.16",
    "pillow>=12.3.0",
    "pycaw>=20251023",
    "pystray>=0.19.5",
]

[project.gui-scripts]
audio-autoswitch = "audio_autoswitch.tray:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.0",
]
